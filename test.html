<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Partner with Members Choice</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:        #1b2a4a;
      --sand:        #F6F6F4;
      --coral:       #e66e43;
      --purple:      #9a88d6;
      --mint:        #6bd1c5;
      --peach:       #e29574;
      --text:        #2c3e50;
      --muted:       #4c5f86;
      --white:       #ffffff;
      --lavender-bg: #dfd9f5;
      --lavender-mid:#8f84cf;
      --green:       #3dbf82;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--sand);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }

    /* ── Card ── */
    .partner-card {
      max-width: 1100px;
      width: 100%;
      border-radius: 28px;
      background: var(--navy);
      position: relative;
      overflow: hidden;
      padding: 96px 40px;
      text-align: center;
    }


    /* ── Content ── */
    .partner-content {
      position: relative;
      z-index: 2;
    }

    .partner-heading {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(2.8rem, 6vw, 5.2rem);
      font-weight: 600;
      color: var(--white);
      line-height: 1.1;
      letter-spacing: -.01em;
      margin-bottom: 20px;
    }
    .partner-heading .dot { color: var(--coral); }

    .partner-sub {
      font-size: 18px;
      font-weight: 300;
      color: rgba(255,255,255,.65);
      max-width: 520px;
      margin: 0 auto 40px;
      line-height: 1.7;
    }

    /* ── CTA Button ── */
    .btn-partner {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--coral);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 500;
      padding: 18px 44px;
      border-radius: 60px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background .22s ease, transform .22s ease, box-shadow .22s ease;
    }
    .btn-partner:hover {
      background: var(--peach);
      color: var(--white);
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(230,110,67,.4);
    }
    .btn-arrow {
      font-size: 18px;
      transition: transform .22s ease;
    }
    .btn-partner:hover .btn-arrow { transform: translateX(4px); }

    @media (max-width: 575px) {
      .partner-card { padding: 72px 24px; }
      .wave-svg { width: 260px; }
      .network-svg { width: 160px; }
    }
  </style>
</head>
<body>

<div class="partner-card">

  
  

  <!-- Content -->
  <div class="partner-content">
    <h2 class="partner-heading">
      Partner with<br>Members Choice<span class="dot">.</span>
    </h2>
    <p class="partner-sub">
      Offer your members real value, effortlessly — and be rewarded as the partnership grows.
    </p>
    <a href="#" class="btn-partner">
      Partner with us <span class="btn-arrow">→</span>
    </a>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
